name: Check ALI data

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/check_ali*"
      - ".github/workflows/check-ali.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/check_ali*"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check data/body_parts.json
        run: uv run scripts/check_ali.py
